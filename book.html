<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book – Moodread</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</head>
<body class="page-book" data-page="book">

<header>
  <div class="wrap nav">
    <a href="index.html" class="logo">
      <svg class="logo-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/><circle cx="18" cy="5" r="1.2"/></svg>
      Moodread
    </a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="shelf.html">My Shelf</a>
    </nav>
    <div class="nav-right">
      <div id="auth"></div>
      <div id="theme-slot"></div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <button class="back" id="back" type="button">&larr; Back</button>

    <div class="detail">
      <div class="bigcover" id="cover"></div>

      <div>
        <span class="badge" id="badge" hidden>Free to read</span>
        <h1 id="title">Loading…</h1>
        <p class="by" id="by"></p>
        <div class="facts" id="facts"></div>
        <div class="actions" id="actions"></div>

        <div class="block">
          <h2 class="h">About this book</h2>
          <div class="desc muted" id="desc">Loading…</div>
          <button class="more" id="more" type="button" hidden>Read more</button>
        </div>

        <div class="block" id="subj-block" hidden>
          <h2 class="h">Subjects</h2>
          <div class="subjects" id="subjects"></div>
        </div>
      </div>
    </div>

    <section id="related" hidden>
      <h2 class="h">More like this</h2>
      <p class="rel-sub" id="rel-sub"></p>
      <div class="rel-row" id="rel"></div>
    </section>
  </div>
</main>

<footer>© 2026 Moodread</footer>

</body>
</html>
